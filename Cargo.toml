[package]
name = "network-monitor"
version = "0.1.0"
edition = "2021"
description = "A lightweight desktop network monitor built with egui"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_plot = "0.31"
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = "0.19"
chrono = "0.4"
winapi = { version = "0.3", features = ["wincon"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
