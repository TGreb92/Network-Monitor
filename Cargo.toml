[package]
name = "network-monitor"
version = "0.1.0"
edition = "2021"
description = "A lightweight desktop network monitor built with egui"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui_plot = "0.31"
chrono = "0.4"
csv = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rfd = "0.15"
notify-rust = "4"
windows-sys = { version = "0.59", features = ["Win32_System_Com"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
